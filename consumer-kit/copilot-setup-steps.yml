name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out the standards marketplace tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Slight76/standards-marketplace
          ref: main
          path: .standards/standards-marketplace
      - name: Check out every pinned standards handbook
        # All Slight76 standards repositories are public; no token is required.
        run: |
          python3 .standards/standards-marketplace/tooling/fetch_standards.py \
            --baseline architecture-baseline.json --dest .standards
      - name: Expose handbook skills to the agent
        run: |
          mkdir -p .agents/skills
          for skill in .standards/*/skills/*/; do
            name="$(basename "$skill")"
            [ "$name" = "standards-marketplace" ] && continue
            rm -rf ".agents/skills/$name"
            cp -R "$skill" ".agents/skills/$name"
          done
          ls .agents/skills
